name: PoE Twitch Drops

on:
  schedule:
    - cron: '7,22,37,52 * * * *'
  workflow_dispatch:
    inputs:
      test_discord:
        description: 'Ook een testbericht naar Discord sturen'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poe-drops-monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Code en opgeslagen threads ophalen
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0

      - name: Discord-secret controleren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then
            echo 'Voeg eerst de repository secret DISCORD_WEBHOOK_URL toe.'
            exit 1
          fi

      - name: Optioneel Discord-testbericht
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.test_discord }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 -u poe_drops.py --test

      - name: PoE 1 en PoE 2 controleren
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python3 -u poe_drops.py --once

      - name: Verwerkte threads bewaren, ook bij gedeeltelijke fouten
        if: ${{ always() }}
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ ! -f state.json ]; then exit 0; fi
          git add -- state.json
          if git diff --cached --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Bewaar gecontroleerde PoE-threads'
          for attempt in 1 2 3; do
            if git push origin "HEAD:$DEFAULT_BRANCH"; then exit 0; fi
            git fetch origin "$DEFAULT_BRANCH"
            git rebase "origin/$DEFAULT_BRANCH" || exit 1
          done
          echo 'Opslaan mislukt. Controleer schrijfrechten en branchbescherming.'
          exit 1
